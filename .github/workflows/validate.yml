name: Validate

# Runs in the published marketplace repository with Node alone and no
# downloaded package: the marketplace entry and plugin.json agree on the
# version, every skill names that version, and the plugin's tree digest is
# printed for comparison with the release record. Claude Code's
# `plugin validate` runs where the pack is authored, before each release.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that every manifest names the same version
        run: |
          node --input-type=module -e "
          import { readFileSync, readdirSync } from 'node:fs';
          const plugin = 'plugins/working-with-constellation';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const version = read(plugin + '/.claude-plugin/plugin.json').version;
          const entry = read('.claude-plugin/marketplace.json').plugins[0];
          const problems = [];
          if (entry.version !== version) problems.push('marketplace entry ' + entry.version + ' vs plugin.json ' + version);
          for (const skill of readdirSync(plugin + '/skills')) {
            const text = readFileSync(plugin + '/skills/' + skill + '/SKILL.md', 'utf8');
            if (!text.includes('\\n  version: ' + version + '\\n')) problems.push(skill + ' does not name ' + version);
          }
          if (problems.length > 0) { console.error(problems.join('\\n')); process.exit(1); }
          console.log('version ' + version + ' is consistent');
          "
      - name: Print the plugin's tree digest
        run: node plugins/working-with-constellation/scripts/tree-digest.mjs plugins/working-with-constellation --exclude manifest.json
